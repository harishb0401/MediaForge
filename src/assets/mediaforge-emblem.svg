<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB4A7" />
      <stop offset="45%" stop-color="#B42A1A" />
      <stop offset="100%" stop-color="#5D170E" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D48B6D" />
      <stop offset="100%" stop-color="#FFDBCE" />
    </linearGradient>
    <filter id="thermalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Facet Bounds -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" fill="#160C0B" stroke="#A98984" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Inner Dynamic Octahedral Core -->
  <polygon points="24,8 38,16 24,24 10,16" fill="url(#amberGlow)" fill-opacity="0.85" />
  <polygon points="10,16 24,24 24,40 10,32" fill="url(#forgeGrad)" />
  <polygon points="38,16 24,24 24,40 38,32" fill="#8E1E12" />
  
  <!-- Crosshair Precision Indicator -->
  <circle cx="24" cy="24" r="3" fill="#FFB4A7" filter="url(#thermalGlow)" />
  <line x1="24" y1="19" x2="24" y2="29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="19" y1="24" x2="29" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Edge Corner Accent Ticks -->
  <circle cx="24" cy="4" r="1.5" fill="#D48B6D" />
  <circle cx="42" cy="14" r="1.5" fill="#D48B6D" />
  <circle cx="42" cy="34" r="1.5" fill="#D48B6D" />
  <circle cx="24" cy="44" r="1.5" fill="#D48B6D" />
  <circle cx="6" cy="34" r="1.5" fill="#D48B6D" />
  <circle cx="6" cy="14" r="1.5" fill="#D48B6D" />
</svg>
